[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.1.0"
description = "Circuit breaker and budget guard for unattended AI coding agents (Claude Code, Codex CLI, Copilot CLI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies are deliberately empty and must stay that way.
# Hooks are spawned by the host CLI as a bare `python3 script.py`, with no venv
# active. Anything reachable from a hook process must be importable from the
# standard library alone.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/agentguard"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
