[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runbreaker"
version = "0.1.0"
description = "Circuit breaker and budget guard for unattended AI coding agents (Claude Code, Codex CLI, Copilot CLI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies are deliberately empty and must stay that way.
# Hooks are spawned by the host CLI as a bare `python3 script.py`, with no venv
# active. Anything reachable from a hook process must be importable from the
# standard library alone.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
runbreaker = "runbreaker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runbreaker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/runbreaker"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the package root on sys.path so `from tests.conftest import ...` resolves
# under the bare `pytest` console script, not only `python -m pytest` (which adds
# the CWD itself). CI runs `pytest`, so without this the tests fail to import.
pythonpath = ["."]

[tool.coverage.run]
source = ["runbreaker"]
# The other platform's locking backend is unreachable here; measuring it would
# only depress the number with code this OS can never run.
omit = ["*/__main__.py"]

[tool.coverage.report]
# A regression floor, not a target. The suite sits well above this; a big drop
# fails CI. Enforced on Linux only (see ci.yml) to avoid cross-platform variance
# in the locking backend. Platform-specific branches carry `# pragma: no cover`.
fail_under = 88
exclude_also = ["# pragma: no cover", "raise NotImplementedError"]
