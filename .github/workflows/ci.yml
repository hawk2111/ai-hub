name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is not incidental here: the locking backend, the interpreter path and
    # the shell quoting all differ, and none of it is exercised on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: mypy --platform win32 src

  no-runtime-deps:
    # The hooks are spawned as a bare `python3` with no venv active. Anything
    # reachable from a hook process must import from the standard library alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/check_stdlib_only.py
